<div class="container">
  <mat-progress-bar *ngIf="syncing" mode="indeterminate"></mat-progress-bar>

  <div class="error-banner" *ngIf="error">
    <mat-icon>error_outline</mat-icon> {{ error }}
  </div>

  <mat-card class="summary-card">
    <mat-card-content>
      <div class="summary">
        <div>
          <span class="label">Загальна сума витрат</span>
          <span class="total">{{ total | number:'1.2-2' }} грн.</span>
        </div>
        <div class="actions-top">
          <button mat-stroked-button (click)="expenseService.sync()" [disabled]="syncing" matTooltip="Синхронізувати">
            <mat-icon>sync</mat-icon> Синхронізувати
          </button>
          <button mat-raised-button color="primary" (click)="openAdd()">
            <mat-icon>add</mat-icon> Додати витрату
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Пошук</mat-label>
    <input matInput (input)="applyFilter($event)" placeholder="Опис, категорія..." />
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Дата</th>
        <td mat-cell *matCellDef="let row">{{ row.date }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Категорія</th>
        <td mat-cell *matCellDef="let row">{{ row.category }}</td>
      </ng-container>

      <ng-container matColumnDef="subcategory">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Субкатегорія</th>
        <td mat-cell *matCellDef="let row">{{ row.subcategory }}</td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Опис</th>
        <td mat-cell *matCellDef="let row">{{ row.description }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Сума</th>
        <td mat-cell *matCellDef="let row" class="amount">{{ row.amount | number:'1.2-2' }} грн.</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button (click)="openEdit(row)" matTooltip="Редагувати">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="delete(row)" matTooltip="Видалити">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
          Витрат не знайдено. Додайте першу!
        </td>
      </tr>
    </table>
  </div>
</div>
