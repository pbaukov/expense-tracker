<h2 mat-dialog-title>{{ isEdit ? 'Редагувати витрату' : 'Додати витрату' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-fields">

    <mat-form-field appearance="outline">
      <mat-label>Дата</mat-label>
      <input matInput type="date" formControlName="date" />
      <mat-error *ngIf="form.get('date')?.hasError('required')">Обов'язкове поле</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Категорія</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let cat of categoryNames" [value]="cat">{{ cat }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('category')?.hasError('required')">Обов'язкове поле</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Субкатегорія</mat-label>
      <mat-select formControlName="subcategory" [disabled]="!subcategories.length">
        <mat-option *ngFor="let sub of subcategories" [value]="sub">{{ sub }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('subcategory')?.hasError('required')">Обов'язкове поле</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Сума (₴)</mat-label>
      <input matInput type="number" formControlName="amount" min="0.01" step="0.01" />
      <mat-error *ngIf="form.get('amount')?.hasError('required')">Обов'язкове поле</mat-error>
      <mat-error *ngIf="form.get('amount')?.hasError('min')">Має бути більше 0</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Опис</mat-label>
      <input matInput formControlName="description" />
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Скасувати</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    {{ isEdit ? 'Зберегти' : 'Додати' }}
  </button>
</mat-dialog-actions>
